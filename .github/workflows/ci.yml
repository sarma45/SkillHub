name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/typecheck.mjs
      - run: npx vitest run
      - run: npm run build
        env:
          COCKPIT_DB_FILE: /tmp/ci-cockpit.db
